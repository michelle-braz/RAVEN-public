# RAVEN — API behind an HTTPS proxy. Copy .env.example to .env and fill it in first.
#   docker compose --env-file .env up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ${RAVEN_IMAGE:-raven:local}
    restart: unless-stopped
    env_file: ${RAVEN_ENV_FILE:-.env}
    environment:
      ENVIRONMENT: production
      RAVEN_DATA_DIR: /data
      RAVEN_TRUSTED_PROXY_HOPS: "1"
    volumes:
      - raven_data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [internal]   # not published: only the proxy can reach it
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 4s
      retries: 4
      start_period: 15s

  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${RAVEN_HTTP_PORT:-80}:80"
      - "${RAVEN_HTTPS_PORT:-443}:443"
    environment:
      RAVEN_DOMAIN: ${RAVEN_DOMAIN:?set RAVEN_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal, edge]

networks:
  internal:
    internal: true
  edge: {}

volumes:
  raven_data:
    name: ${RAVEN_DATA_VOLUME:-raven_data}
  caddy_data:
  caddy_config:
