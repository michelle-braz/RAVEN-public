[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "raven"
version = "1.1.0"
description = "RAVEN: human-first incident context. Deterministic scoring, evidence separated from hypothesis, human decision."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Michelle Braz" }]
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
raven-admin = "raven.admin:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
raven = ["api/landing.html", "api/static/*", "api/static/.gitkeep", "missions/web/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
